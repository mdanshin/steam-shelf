name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install and test
        run: |
          npm ci
          npm test
          sudo python -m unittest test.test_deploy_config.DeployConfigTests.test_runtime_integrity_allows_internal_symlinks_and_rejects_extra_entries
          STEAM_DEALS_SKIP_COVERS=1 npm run sync:deals
          npm run build:client
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify allowlisted static artifact
        run: python scripts/verify_pages.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request
          import urllib.parse

          url = os.environ["PAGE_URL"]
          marker = "Продолжить с Google"
          for attempt in range(10):
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "steam-shelf-pages-check"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = response.read(256_000).decode("utf-8", "replace")
                      final = urllib.parse.urlparse(response.geturl())
                      trusted_host = final.hostname in {"mdanshin.github.io", "danshin.ms"}
                      trusted_path = final.path.rstrip("/") == "/steam-shelf"
                      if response.status == 200 and final.scheme == "https" and trusted_host and trusted_path and marker in body:
                          print(f"Verified {response.geturl()}")
                          raise SystemExit(0)
              except Exception as error:
                  print(f"Attempt {attempt + 1}: {error}")
              time.sleep(6)
          raise SystemExit("Deployed page did not serve the expected marker")
          PY
