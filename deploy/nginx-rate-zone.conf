# This file is included by nginx in the global http context.
# Xray forwards the real client address with PROXY protocol to nginx:8444.
# Every method, including unauthenticated preflight, consumes this per-client budget.

map $http_origin $steam_shelf_cors_origin {
    default "";
    "https://danshin.ms" $http_origin;
    "https://mdanshin.github.io" $http_origin;
}

limit_req_zone $binary_remote_addr zone=steam_shelf_gateway:1m rate=30r/m;
